{% extends "layout.html" %}
{% block content %}
<div class="container text-center py-5">
    <h1 class="display-4 mb-4">VSSUT Secure Exam Portal</h1>
    <p class="lead mb-5">Select your role to continue to the secure login gateway.</p>

    <div class="row justify-content-center g-4">
        <div class="col-md-3">
            <a href="{{ url_for('login', role='admin') }}" class="text-decoration-none">
                <div class="card h-100 shadow-sm border-danger hover-shadow">
                    <div class="card-body py-5">
                        <h2 class="display-6 text-danger">Admin</h2>
                        <p class="text-muted">System management & control</p>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-3">
            <a href="{{ url_for('login', role='teacher') }}" class="text-decoration-none">
                <div class="card h-100 shadow-sm border-primary hover-shadow">
                    <div class="card-body py-5">
                        <h2 class="display-6 text-primary">Teacher</h2>
                        <p class="text-muted">Exam creation & grading</p>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-3">
            <a href="{{ url_for('login', role='student') }}" class="text-decoration-none">
                <div class="card h-100 shadow-sm border-success hover-shadow">
                    <div class="card-body py-5">
                        <h2 class="display-6 text-success">Student</h2>
                        <p class="text-muted">Attempt exams & view results</p>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>

<style>
    .hover-shadow:hover { 
        transform: translateY(-10px); 
        transition: 0.3s; 
        box-shadow: 0 1rem 3rem rgba(0,0,0,0.175)!important;
    }
</style>
{% endblock %}
