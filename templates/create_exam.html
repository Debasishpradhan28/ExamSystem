{% extends "layout.html" %}
{% block content %}
<div class="card shadow">
    <div class="card-header bg-primary text-white">
        <h3>Create New Exam ({{ current_user.department.name }} Dept)</h3>
    </div>
    <div class="card-body">
        <form id="examForm" method="POST">
            <a href="{{ url_for('upload_paper') }}" class="btn btn-outline-primary w-100">
        <i class="bi bi-robot"></i> + AI Paper Upload
    </a>
            <div class="row mb-4">
                <div class="col-md-8">
                    <label class="form-label">Exam Title</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g. Mid-Sem Algorithm Analysis" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Duration (Minutes)</label>
                    <input type="number" name="duration" class="form-control" value="60" required>
                </div>
                <div class="row mb-3">
    <div class="col-md-6">
        <label class="form-label">Exam Start Date & Time</label>
        <input type="datetime-local" name="start_time" class="form-control" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Exam End Date & Time (Deadline)</label>
        <input type="datetime-local" name="end_time" class="form-control" required>
    </div>
</div>
            </div>

            <hr>
            <h5>Questions</h5>
            <div id="questionsContainer">
                </div>

            <div class="mt-3">
                <button type="button" onclick="addQuestion('mcq')" class="btn btn-outline-secondary btn-sm">+ Add MCQ</button>
                <button type="button" onclick="addQuestion('short')" class="btn btn-outline-secondary btn-sm">+ Add Short Answer</button>
                <button type="button" onclick="addQuestion('long')" class="btn btn-outline-secondary btn-sm">+ Add Long Answer</button>
            </div>

            <hr>
            <button type="submit" class="btn btn-success w-100">Publish Exam</button>
        </form>
    </div>
</div>

<script>
let qCount = 0;
function addQuestion(type) {
    const container = document.getElementById('questionsContainer');
    let html = `
        <div class="card mb-3 border-left-primary shadow-sm" id="q_${qCount}">
            <div class="card-body">
                <input type="hidden" name="q_type[]" value="${type}">
                <label>Question ${qCount + 1} (${type.toUpperCase()})</label>
                <textarea name="q_text[]" class="form-control mb-2" required></textarea>`;

    if (type === 'mcq') {
        html += `
            <div class="row g-2">
                <div class="col-6"><input type="text" name="opt_a_${qCount}" class="form-control form-control-sm" placeholder="Option A"></div>
                <div class="col-6"><input type="text" name="opt_b_${qCount}" class="form-control form-control-sm" placeholder="Option B"></div>
                <div class="col-6"><input type="text" name="opt_c_${qCount}" class="form-control form-control-sm" placeholder="Option C"></div>
                <div class="col-6"><input type="text" name="opt_d_${qCount}" class="form-control form-control-sm" placeholder="Option D"></div>
                <div class="col-12 mt-2">
                    <select name="correct_${qCount}" class="form-select form-select-sm">
                        <option value="A">Correct Answer: A</option>
                        <option value="B">Correct Answer: B</option>
                        <option value="C">Correct Answer: C</option>
                        <option value="D">Correct Answer: D</option>
                    </select>
                </div>
            </div>`;
    }
    
    html += `<button type="button" class="btn btn-danger btn-sm mt-2" onclick="document.getElementById('q_${qCount}').remove()">Delete Question</button>
            </div>
        </div>`;
    
    container.insertAdjacentHTML('beforeend', html);
    qCount++;
}
</script>
{% endblock %}
